<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Customer complaints, service operations, and SLA monitoring dashboard.">
  <title>Customer Care Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#dashboard" aria-label="Customer Care home">
        <span class="brand-mark">cc</span>
        <span class="brand-name">northstar<span>care operations</span></span>
      </a>

      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-link is-active" data-view="dashboard"><span class="nav-icon">▦</span>Overview</button>
        <button class="nav-link" data-view="complaints"><span class="nav-icon">▤</span>Complaints</button>
        <button class="nav-link" data-view="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-link" data-view="agents"><span class="nav-icon">♧</span>Agents</button>
        <button class="nav-link" data-view="assignments"><span class="nav-icon">⇄</span>Assignments</button>
        <button class="nav-link" data-view="messages"><span class="nav-icon">▱</span>Messages</button>
      </nav>

      <div class="nav-label nav-label-spaced">SERVICE HEALTH</div>
      <nav class="nav-list">
        <button class="nav-link" data-view="slas"><span class="nav-icon">◷</span>SLA monitoring</button>
        <button class="nav-link" data-view="resolutions"><span class="nav-icon">✓</span>Resolutions</button>
        <button class="nav-link" data-view="feedback"><span class="nav-icon">☆</span>Customer feedback</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="connection-card">
          <span class="connection-dot" id="connection-dot"></span>
          <div><strong id="connection-label">Checking API</strong><small>Local service · port 8000</small></div>
        </div>
        <div class="sidebar-foot">Customer Care Console <span>v1.0</span></div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="page-crumb">Overview</strong></div>
        <div class="topbar-actions">
          <span class="api-pill"><i></i> API <span id="api-status">checking</span></span>
          <button class="icon-button" id="refresh-view" title="Refresh current view" aria-label="Refresh">↻</button>
          <span class="avatar" aria-label="Local operator">OP</span>
        </div>
      </header>

      <div class="content-wrap">
        <div id="view-root" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span><span>Connecting to the service…</span></div>
        </div>
        <footer class="page-footer"><span>Northstar Care Operations</span><span>Service data is loaded from the connected API.</span></footer>
      </div>
    </main>
  </div>

  <dialog class="modal" id="modal">
    <div class="modal-heading"><div><div class="eyebrow" id="modal-eyebrow">DETAILS</div><h2 id="modal-title">Record details</h2></div><button class="icon-button" id="modal-close" aria-label="Close dialog">×</button></div>
    <div id="modal-body"></div>
  </dialog>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/app.js" defer></script>
</body>
</html>
